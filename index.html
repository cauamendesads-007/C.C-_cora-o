<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para minha Amada Clarice 🩷 </title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff3333;
            --glass-bg: rgba(20, 0, 0, 0.4);
            --glass-border: rgba(255, 100, 100, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050000; /* Fundo bem escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        /* Foto de Fundo Transparente */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('54794.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.25; /* Transparência para destacar o coração */
            filter: blur(3px); /* Desfoque romântico */
            z-index: 0;
        }

        /* Canvas do Coração */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Detalhes Florais (Pétalas caindo) */
        .petal {
            position: absolute;
            background-color: #ff4d4d;
            border-radius: 15px 0 15px 0;
            opacity: 0.6;
            z-index: 2;
            box-shadow: 0 0 5px #ff1a1a;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1); opacity: 0; }
        }

        /* Container da interface: frase, botão e gatos */
        .ui-container {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            max-height: calc(100dvh - 30px);
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        .ui-container::-webkit-scrollbar {
            display: none;
        }

        /* Caixa de Frase com Efeito de Vidro (Glassmorphism) */
        .phrase-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 0;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .phrase-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .phrase-text {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin: 0;
        }

        /* Botão Moderno */
        .btn-declare {
            background: linear-gradient(135deg, #e60000 0%, #ff4d4d 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-declare:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(230, 0, 0, 0.6);
        }

        .btn-declare:active {
            transform: translateY(1px);
        }

        /* Gatos dentro do mesmo layout do botão */
        .pets-container {
            position: static;
            flex: 0 0 auto;
            margin: 0;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .pets-container img {
            display: block;
            width: 100px;
            max-width: 100%;
            height: auto;
        }

        .pets-container:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        /* Cantos Florais Estáticos */
        .flower-corner {
            position: absolute;
            font-size: 40px;
            z-index: 3;
            opacity: 0.7;
            filter: drop-shadow(0 0 10px rgba(255, 50, 50, 0.5));
        }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; transform: scaleX(-1); }

        /* Responsividade */
        @media (max-width: 768px) {
            .ui-container {
                bottom: 15px;
                width: 94%;
                gap: 10px;
                max-height: calc(100dvh - 25px);
            }

            .phrase-text { font-size: 22px; }

            .phrase-box {
                padding: 12px 16px;
                margin-bottom: 5px;
            }

            .pets-container img { width: 85px; }

            .pets-container:hover { transform: scale(1.05) rotate(-2deg); }

            .btn-declare {
                font-size: 14px;
                padding: 10px 20px;
                max-width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <div class="background-image"></div>

    <div class="flower-corner top-left">🌹🌿</div>
    <div class="flower-corner top-right">🌹🌿</div>

    <canvas id="heartCanvas"></canvas>
      
    <div class="ui-container">
        <div class="phrase-box" id="phraseBox">
            <p class="phrase-text" id="phraseText">Clique no botão para uma surpresa...</p>
        </div>

        <button class="btn-declare" onclick="generatePhrase()">
            ✨ Diga-me algo lindo
        </button>

        <div class="pets-container">
            <img src="gatos.png" alt="Gatinhos">
        </div>
    </div>

    <script>
        /* =========================================
           SISTEMA DE PÉTALAS CAINDO (FLORES)
           ========================================= */
        function createPetals() {
            const petalCount = window.innerWidth < 768 ? 15 : 30;
            for (let i = 0; i < petalCount; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                
                // Tamanhos e posições aleatórias
                let size = Math.random() * 10 + 5;
                petal.style.width = `${size}px`;
                petal.style.height = `${size}px`;
                petal.style.left = `${Math.random() * 100}vw`;
                
                // Duração e atraso da animação
                let duration = Math.random() * 5 + 5; // 5 a 10 segundos
                let delay = Math.random() * 5;
                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `${delay}s`;
                
                document.body.appendChild(petal);
            }
        }
        createPetals();

        /* =========================================
           GERADOR DE FRASES ROMÂNTICAS
           ========================================= */
        const romanticPhrases = [
            "Você é a poesia que eu nunca canso de ler.",
            "No meio de tanta confusão, você é a minha paz.",
            "Meu lugar favorito no mundo é dentro do seu abraço.",
            "Cada batida do meu coração chama pelo seu nome.",
            "Se eu tivesse mil vidas, em todas elas eu procuraria por você.",
            "Você é o sonho mais lindo que a vida me permitiu viver.",
            "Com você, o amor deixou de ser uma palavra e virou meu destino.",
            "Seus olhos são o farol que ilumina os meus dias mais escuros.",
            "Estar ao seu lado torna os dias comuns extraordinários.",
            "Você transforma qualquer momento simples na minha lembrança favorita.",
            "Seu abraço tem o poder de recarregar todas as minhas energias.",
            "Você é o meu pensamento preferido ao acordar e ao dormir.",
            "Seu sorriso é o meu lugar favorito no mundo que sempre me acolhe.",
            "Entre bilhões de pessoas, meus olhos sempre vão escolher você.",
            "Seu riso é a trilha sonora favorita de todos os meus dias.",
            "Amo você por quem você é e por quem eu me torno ao seu lado.",
            "Você é o detalhe mais bonito que o destino colocou na minha história.",
            "O mundo inteiro fica em paz quando você encosta a cabeça no meu peito.",
            "Não importa para onde eu vá, meu coração sempre escolhe voltar para você.",
            "Você é o motivo dos meus sorrisos mais sinceros e descontraídos.",
            "Seu carinho é o único abrigo de que eu realmente preciso para ser feliz.",
            "Estar com você é como sentir o calor do sol em uma manhã de inverno.",
            "Se o amor pudesse ser traduzido, ele teria exatamente o seu nome.",
            "A minha vida ganhou cores muito mais vivas desde que você chegou.",
           "Você é o meu cais, o meu porto seguro em qualquer tempestade.",
           "Amo como a nossa sintonia transforma os instantes mais simples em mágica.",
           "Você é a melhor parte da minha rotina, o meu pensamento mais doce.",
          "Com você, a vida é mais leve e o futuro parece um lugar lindo para se viver.",
           "Seu amor é o maior presente que o universo poderia ter me reservado.",
            "Você é a página mais linda que o destino escreveu na minha vida."
            
        ];

        function generatePhrase() {
            const box = document.getElementById('phraseBox');
            const textEl = document.getElementById('phraseText');
            
            // Esconde suavemente
            box.classList.remove('show');
            
            setTimeout(() => {
                // Escolhe uma frase aleatória
                const randomIndex = Math.floor(Math.random() * romanticPhrases.length);
                textEl.textContent = romanticPhrases[randomIndex];
                // Mostra suavemente
                box.classList.add('show');
            }, 400); // Espera a transição de saída
        }

        /* =========================================
           O SEU CÓDIGO DO CORAÇÃO ANIMADO
           ========================================= */
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Σ' αγαπώ", "Я тебя люблю",
            "愛してる", "사랑해", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "ฉันรักเธอ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "Aku cinta kamu", "Anh yêu em", "Eu te amo"
        ];

        const colors = [
            "#ff3333", "#ff4d4d", "#ff6666", "#e60000", "#cc0000", "#ff1a1a"
        ];

        let words = []; 
        let isAnimating = true;
        let animationProgress = 0; 

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x * scale, y: -y * scale };
        }

        function generateWords() {
            words = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 50; 
            
            const scale = Math.min(canvas.width, canvas.height) / 45; 
            ctx.font = "bold 14px Arial"; 

            const stepY = 18; 
            const stepX = 5; 
            
            let minY = Infinity, maxY = -Infinity;
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                const pt = getHeartPoint(t, scale);
                if (pt.y < minY) minY = pt.y;
                if (pt.y > maxY) maxY = pt.y;
            }

            for (let y = minY; y <= maxY; y += stepY) {
                let leftX = Infinity, rightX = -Infinity;
                for (let t = 0; t < Math.PI * 2; t += 0.01) {
                    const pt = getHeartPoint(t, scale);
                    if (Math.abs(pt.y - y) < stepY / 2) {
                        if (pt.x < leftX) leftX = pt.x;
                        if (pt.x > rightX) rightX = pt.x;
                    }
                }

                if (leftX === Infinity || rightX === -Infinity) continue;
                
                leftX += 5; rightX -= 5;
                let currentX = leftX;
                
                while (currentX < rightX) {
                    const text = phrases[Math.floor(Math.random() * phrases.length)];
                    const fontSize = Math.random() > 0.8 ? (Math.floor(Math.random() * 6) + 16) : (Math.floor(Math.random() * 4) + 12);
                    ctx.font = `bold ${fontSize}px Arial`;
                    
                    const textWidth = ctx.measureText(text).width;
                    
                    if (currentX + textWidth <= rightX) {
                        const yOffset = (Math.random() - 0.5) * 6; 
                        words.push({
                            text: text,
                            x: centerX + currentX,
                            y: centerY + y + yOffset,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            font: `bold ${fontSize}px Arial`,
                            opacity: 0,
                            targetY: y 
                        });
                        currentX += textWidth + (Math.random() * 10 + 5); 
                    } else {
                        currentX += stepX; 
                    }
                }
            }

            words.sort((a, b) => a.targetY - b.targetY);
            words.forEach((word, index) => {
                word.revealThreshold = index / words.length; 
            });
        }

        let lastTime = 0;
        function animate(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isAnimating) {
                animationProgress += deltaTime * 0.00015; 
                if (animationProgress > 1.2) isAnimating = false;
            }

            words.forEach(word => {
                if (isAnimating) {
                    let currentOpacity = (animationProgress - word.revealThreshold) * 5; 
                    word.opacity = Math.max(0, Math.min(1, currentOpacity)); 
                } else {
                    word.opacity = 1;
                }

                if (word.opacity > 0) {
                    ctx.font = word.font;
                    ctx.fillStyle = word.color;
                    ctx.globalAlpha = word.opacity;
                    ctx.shadowColor = word.color;
                    ctx.shadowBlur = 4; // Aumentei um pouco o brilho
                    ctx.fillText(word.text, word.x, word.y);
                    ctx.shadowBlur = 0;
                }
            });

            ctx.globalAlpha = 1; 
            requestAnimationFrame(animate);
        }

        generateWords();
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            isAnimating = true;
            animationProgress = 0;
            generateWords();
        });
    </script>
</body>
</html>
